<div class="col-lg-11">

    <!-- Title -->
    <h2 class="stock-title text-center mb-4">
        Stock Market Dashboard
    </h2>

    <!-- Search Card -->
    <div class="card stock-card mb-4">

        <div class="card-body">

            <div class="input-group">

                <input
                    type="text"
                    id="symbol"
                    class="form-control stock-input"
                    value="{{ symbol|default:'AAPL' }}"
                    placeholder="Enter Stock Symbol"
                >

                <button
                    class="btn btn-primary"
                    type="button"
                    onclick="getStockData()"
                >
                    Search
                </button>

            </div>

            <p id="error-message"
                class="text-danger mt-3 mb-0">
            </p>

        </div>

    </div>

    <!-- Latest Price Card -->
    <div class="card stock-card mb-4">

        <div class="card-body text-center">

            <h5 id="stock-symbol">AAPL</h5>

            <h2 id="latest-price" class="price-same">
                --
            </h2>

            <h6 id="price-change" class="price-same">
                --
            </h6>

            <p class="update-status mt-3">
                Last updated:
                <span id="last-updated">--</span>
            </p>

        </div>

    </div>

    <!-- Stock Information -->
    <div class="row g-3 mb-4">

        <div class="col-6 col-md-3">

            <div class="card stock-card text-center h-100">

                <div class="card-body">

                    <p class="text-secondary">Open</p>

                    <h5 id="open">--</h5>

                </div>

            </div>

        </div>


        <div class="col-6 col-md-3">

            <div class="card stock-card text-center h-100">

                <div class="card-body">

                    <p class="text-secondary">High</p>

                    <h5 id="high">--</h5>

                </div>

            </div>

        </div>


        <div class="col-6 col-md-3">

            <div class="card stock-card text-center h-100">

                <div class="card-body">

                    <p class="text-secondary">Low</p>

                    <h5 id="low">--</h5>

                </div>

            </div>

        </div>


        <div class="col-6 col-md-3">

            <div class="card stock-card text-center h-100">

                <div class="card-body">

                    <p class="text-secondary">Volume</p>

                    <h5 id="volume">--</h5>

                </div>

            </div>

        </div>

    </div>

    <!-- Stock Table -->
    <div class="card stock-card">

        <div class="card-body">

            <h5 class="stock-title mb-3">
                
                Stock History
            </h5>

            <div class="table-responsive">

                <table class="table stock-table text-center">

                    <thead>

                        <tr>
                            <th>Symbol</th>
                            <th>Date</th>
                            <th>Open</th>
                            <th>High</th>
                            <th>Low</th>
                            <th>Close</th>
                            <th>Volume</th>
                        </tr>

                    </thead>

                    <tbody id="stock-data">

                        <tr>
                            <td colspan="7">Loading...</td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <p class="update-status text-end mt-3 mb-0">
                Auto refresh: per seconds
            </p>

        </div>

    </div>

</div>
