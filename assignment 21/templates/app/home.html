
{% extends "base.html" %}

{% block title %}Real-Time Stock Market{% endblock title %}

{% block content %}

<div class="stock-container py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-11">

                <h2 class="stock-title text-center mb-4">
                    Stock Market Dashboard
                </h2>

                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">META Historical Stock Data</h5>
                    </div>

                    <div class="card-body table-responsive">

                        {% if data %}
                            {{ data|safe }}
                        {% else %}
                            <p class="text-danger">
                                No stock data available.
                            </p>
                        {% endif %}

                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock content %}
