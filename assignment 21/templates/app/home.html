
{% extends "base.html" %}

{% block title %}Real-Time Stock Market{% endblock title %}

{% block content %}

<div class="stock-container">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-11">

                <!-- Title -->
                <h2 class="stock-title text-center mb-4">
                    Stock Market Dashboard
                </h2>
                {% for key, value in stock.items %}
                    <p>
                        <strong>{{ key }}:</strong> {{ value }}
                    </p>
                {% endfor %}
            </div>

        </div>

    </div>

</div>

{% endblock content %}
