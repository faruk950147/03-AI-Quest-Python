
{% extends "base.html" %}

{% block title %}Chat Room{% endblock title %}

{% block content %}

<main class="container-fluid vh-100 p-3">

    <div class="row bg-secondary rounded shadow h-100 overflow-hidden">

        <!-- Sidebar -->
        <div class="col-md-4 col-lg-3 border-end border-dark p-0 d-flex flex-column">

            <div class="p-4 bg-secondary">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h4 class="fw-bold mb-0">
                        <i class="bi bi-chat-dots-fill me-2"></i>
                        Chat Room
                    </h4>

                    <button class="btn btn-dark rounded-circle">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>

                </div>

                <input
                    type="text"
                    class="form-control bg-dark text-white border-0 rounded-pill"
                    placeholder="Search conversations..."
                >

            </div>

            <!-- Friend List -->
            <div class="flex-grow-1 overflow-auto">

                <a href="#"
                   class="friend-item d-flex align-items-center p-3 text-decoration-none text-white bg-primary">

                    <div class="rounded-circle bg-light text-primary fw-bold p-3 me-3">
                        SA
                    </div>

                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1">Sarah Ahmed</h6>
                        <small>Hey! How are you?</small>
                    </div>

                    <small>10:30</small>

                </a>

                <a href="#"
                   class="friend-item d-flex align-items-center p-3 text-decoration-none text-white">

                    <div class="rounded-circle bg-dark fw-bold p-3 me-3">
                        JS
                    </div>

                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1">John Smith</h6>
                        <small>See you tomorrow!</small>
                    </div>

                    <small>09:45</small>

                </a>

                <a href="#"
                   class="friend-item d-flex align-items-center p-3 text-decoration-none text-white">

                    <div class="rounded-circle bg-danger fw-bold p-3 me-3">
                        EW
                    </div>

                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1">Emma Wilson</h6>
                        <small>Thanks for your help.</small>
                    </div>

                    <small>Yesterday</small>

                </a>

            </div>

        </div>


        <!-- Chat Area -->
        <div class="col-md-8 col-lg-9 p-0 d-flex flex-column bg-dark">

            <!-- Chat Header -->
            <div class="border-bottom border-secondary bg-secondary p-3">

                <div class="d-flex justify-content-between align-items-center">

                    <div class="d-flex align-items-center">

                        <div class="rounded-circle bg-primary p-3 me-3 fw-bold">
                            GR
                        </div>

                        <div>

                            <h5 class="fw-bold mb-0">
                                General Chat
                            </h5>

                            <small id="connection-status"
                                   class="text-warning d-block">
                                Connecting...
                            </small>

                        </div>

                    </div>

                    <div>

                        <button class="btn btn-dark rounded-circle">
                            <i class="bi bi-telephone"></i>
                        </button>

                        <button class="btn btn-dark rounded-circle">
                            <i class="bi bi-camera-video"></i>
                        </button>

                    </div>

                </div>

            </div>


            <!-- Chat Messages -->
            <div id="chat-messages"
                 class="flex-grow-1 p-4 overflow-auto">

            </div>


            <!-- Message Footer -->
            <div class="bg-secondary border-top border-dark p-3">

                <form id="message-form"
                      class="d-flex align-items-center gap-2">

                    <input
                        type="text"
                        id="message-input"
                        class="form-control bg-dark text-white border-0 rounded-pill"
                        placeholder="Type your message..."
                        autocomplete="off"
                        maxlength="2000"
                    >

                    <button
                        type="submit"
                        id="send-button"
                        class="btn btn-primary rounded-circle"
                        disabled
                    >

                        <i class="bi bi-send-fill"></i>

                    </button>

                </form>

            </div>

        </div>

    </div>

</main>

{% endblock content %}
